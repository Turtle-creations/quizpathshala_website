{% extends "base.html" %}

{% block content %}
<section class="page-hero">
    <div class="container narrow">
        <span class="eyebrow">Reset Password</span>
        <h1>Create a new password</h1>
        <p>Choose a strong new password for <strong>{{ reset_email }}</strong>. After saving it, the current reset session will be consumed.</p>
    </div>
</section>

<section class="section">
    <div class="container narrow">
        <form accept-charset="UTF-8" method="post" class="form-card">
            <label for="password">New Password</label>
            <input id="password" name="password" type="password" minlength="6" required>
            <label for="confirm_password">Confirm New Password</label>
            <input id="confirm_password" name="confirm_password" type="password" minlength="6" required>
            <button class="button button-primary" type="submit">Update Password</button>
            <p><a href="{{ url_for('auth.login') }}">Back to login</a></p>
        </form>
    </div>
</section>
{% endblock %}
